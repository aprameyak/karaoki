[project]
name = "karaoki-worker"
version = "0.1.0"
description = "Karaoki background worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "karaoki-api",
  "demucs>=4.1.0",
  "torch==2.15.0",
  "torchaudio==2.11.1",
  "numpy>=1.26,<2.4",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.5",
]

[tool.uv]
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[tool.uv.sources]
karaoki-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real separation model"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
